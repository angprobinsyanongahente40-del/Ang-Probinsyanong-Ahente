<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ang Probinsyanong Ahente</title>

    <!-- Favicon for browser tab -->
    <link rel="icon" type="image/png" href="https://i.imgur.com/TcCQCER.png">
    <link rel="shortcut icon" type="image/png" href="https://i.imgur.com/TcCQCER.png">
    
    <!-- For Apple devices -->
    <link rel="apple-touch-icon" href="https://i.imgur.com/TcCQCER.png">
    
    <style>
    :root{--navy:#061b45;--blue:#1a4fc4;--red:#d21f34;}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f7fc;font-family:Arial,Helvetica,sans-serif}
    .brandbar{height:64px;display:flex;align-items:center;gap:11px;padding:8px 22px;background:var(--navy);border-bottom:4px solid transparent;border-image:linear-gradient(90deg,var(--blue) 0 50%,var(--red) 50%) 1;color:#fff}
    .brandbar img{width:46px;height:46px;object-fit:contain;border-radius:8px}
    .brand-name{font-weight:900;font-size:16px;letter-spacing:.035em;text-transform:uppercase;line-height:1.1}
    .brand-name .blue{color:#5c8cff}.brand-name .red{color:#ff5b69}
    .brand-sub{display:block;margin-top:3px;color:#ffd873;font-size:9px;letter-spacing:.12em;font-weight:700}
    #gas-iframe{display:block;width:100%;height:calc(100% - 64px);border:0;background:#fff}
    @media(max-width:520px){.brandbar{height:58px;padding:7px 13px}.brandbar img{width:40px;height:40px}.brand-name{font-size:12px}.brand-sub{font-size:7px}#gas-iframe{height:calc(100% - 58px)}}
  </style>
</head>
<body>
  <header class="brandbar" aria-label="Ang Probinsyanong Ahente">
    <img src="https://i.imgur.com/TcCQCER.png" alt="Ang Probinsyanong Ahente logo">
    <div class="brand-name"><span>ANG</span> <span class="blue">PROBINSYANONG</span> <span class="red">AHENTE</span><span class="brand-sub">ERWIN BAGUIOAN · CAVITE PROPERTIES</span></div>
  </header>
  <iframe id="gas-iframe" title="Ang Probinsyanong Ahente consultation page" src="https://script.google.com/macros/s/AKfycby7hHY1wmvEvlDszbcvLFxV9OL8rL9c9egnBknM24IFSumqXuoNvamiGAIX9INXlobT/exec" allow="geolocation; clipboard-read; clipboard-write"></iframe>
</body>
</html>
